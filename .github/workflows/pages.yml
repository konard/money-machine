name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/build-catalog.mjs'
      - 'scripts/build-website.mjs'
      - 'scripts/render-business-plan.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build catalog and website
        run: npm run build:catalog

      - name: Run tests against the fresh build
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
