name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build English and Russian content
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Restore translation memory
        uses: actions/cache@v4
        with:
          path: formal-ai/.site-ru/memory
          key: russian-translation-v1-${{ github.sha }}
          restore-keys: russian-translation-v1-

      - name: Restore public dictionary responses
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/formal-ai-public
          key: russian-dictionaries-v1-${{ github.sha }}
          restore-keys: russian-dictionaries-v1-

      - name: Translate repository and build both websites
        env:
          FORMAL_AI_OFFLINE: ${{ github.event_name == 'pull_request' && '1' || '' }}
          FORMAL_AI_SPARSE_FIXTURES: ${{ github.event_name == 'pull_request' && '1' || '' }}
          FORMAL_AI_FIXTURES: tests/formal-ai/fixtures/public
          FORMAL_AI_CACHE: ${{ runner.temp }}/formal-ai-public
          FORMAL_AI_CACHE_ONLY_SOURCES: ${{ github.event_name != 'pull_request' && 'ru.wikipedia' || '' }}
        run: |
          export FORMAL_AI_FIXTURE_VERSION="$(git rev-parse HEAD:tests/formal-ai/fixtures/public)"
          if [ -z "$FORMAL_AI_OFFLINE" ]; then
            export FORMAL_AI_NETWORK_DEADLINE="$(( ($(date +%s) + 480) * 1000 ))"
          fi
          npm run formal-ai:repository

      - name: Verify complete build and actual Russian output
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const translation = read('formal-ai/.site-ru/report.json');
          const website = read('website/ru/build-report.json');
          const catalog = read('website/ru/strategies.json');
          if (translation.scope !== 'repository' || translation.selected !== translation.available ||
              translation.failed || !translation.translated || website.partial ||
              !catalog.strategies.some(({ summary }) => /\p{Script=Cyrillic}/u.test(summary))) {
            throw new Error('Repository translation or Russian Pages build is incomplete.');
          }
          console.log(`${translation.selected} jobs. ${translation.translated}/${translation.sentences} units contain generated Russian.`);
          JS

      - name: Run tests against the fresh build
        if: github.event_name != 'pull_request'
        run: npm test

      - name: Upload Russian repository content and translation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: russian-repository
          path: |
            formal-ai/.site-ru/
            !formal-ai/.site-ru/memory/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
